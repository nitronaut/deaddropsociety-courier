  cy += 4;
  ctx.fillStyle = 'rgba(159,182,204,0.6)';
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillText('FINANCE', x + 12, cy);
  cy += 16;
  ctx.fillStyle = SUBWAY_COL;
  ctx.font = 'bold 13px ui-monospace,monospace';
  ctx.fillText('◈ OPIUM LOTS', x + 12, cy);
  ctx.textAlign = 'right';
  ctx.fillText('' + persistent.credits, x + w - 12, cy);
  ctx.textAlign = 'left';
}

function drawWeaponBar(x, y){
  const w = 220, h = 80;
  ctx.fillStyle = 'rgba(4,6,12,0.78)';
  ctx.fillRect(x - 8, y - 8, w, h);
  ctx.strokeStyle = 'rgba(61,240,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 8 + 0.5, y - 8 + 0.5, w, h);

  ctx.fillStyle = 'rgba(159,182,204,0.6)';
  ctx.font = '10px ui-monospace,monospace';
  ctx.fillText('WEAPONS', x, y + 4);

  let cy = y + 20;
  for (let i = 0; i < WEAPON_ORDER.length; i++){
    const k = WEAPON_ORDER[i];
    const d = WEAPON_DEFS[k];
    const lvl = persistent.loot.weapons[k];
    const active = player.activeWeapon === k;
    const locked = lvl <= 0;

    ctx.fillStyle = active ? d.col : locked ? '#5a6b7c' : '#cfe9ff';
    ctx.font = (active ? 'bold ' : '') + '11px ui-monospace,monospace';
    ctx.fillText('[' + (i+1) + '] ' + d.name, x, cy);

    ctx.textAlign = 'right';
    if (locked){
      ctx.fillStyle = '#5a6b7c';
      ctx.fillText('LOCKED', x + w - 20, cy);
    } else {
      ctx.fillStyle = d.col;
      ctx.fillText('L' + lvl, x + w - 20, cy);
    }
    ctx.textAlign = 'left';

    if (active){
      ctx.fillStyle = d.col;
      ctx.fillRect(x - 4, cy - 9, 2, 10);
    }
    cy += 16;
  }
}

function drawSubwayPanel(x, y){
  const w = 220, h = 90;
  ctx.fillStyle = 'rgba(4,6,12,0.78)';
  ctx.fillRect(x - 8, y - 8, w, h);
  ctx.strokeStyle = 'rgba(184,115,255,0.35)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - 8 + 0.5, y - 8 + 0.5, w, h);

  ctx.fillStyle = SUBWAY_COL;
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillText('◈ SUBWAY LINE', x, y + 4);

  const here = subwayStationAt(player.x, player.y);

  let cy = y + 22;
  for (let i = 0; i < subway.stops.length; i++){
    const s = subway.stops[i];
    const active = here === i;
    const cost = here >= 0 ? (Math.abs(i - here) * SUBWAY_COST_PER_STOP) : 0;

    ctx.fillStyle = active ? '#fff' : (here >= 0 ? 'rgba(217,180,255,0.85)' : 'rgba(159,182,204,0.55)');
    ctx.font = (active ? 'bold ' : '') + '11px ui-monospace,monospace';
    ctx.fillText((active ? '▶ ' : '  ') + 'STATION ' + (i+1), x, cy);

    ctx.textAlign = 'right';
    if (active){
      ctx.fillStyle = '#fff';
      ctx.fillText('HERE', x + w - 20, cy);
    } else if (here >= 0){
      ctx.fillStyle = persistent.credits >= cost ? SUBWAY_COL : '#5a6b7c';
      ctx.fillText(cost + ' ◈', x + w - 20, cy);
    } else {
      ctx.fillStyle = 'rgba(159,182,204,0.35)';
      ctx.fillText('—', x + w - 20, cy);
    }
    ctx.textAlign = 'left';
    cy += 14;
  }

  cy += 2;
  if (here >= 0 && !subwayRide){
    ctx.fillStyle = SUBWAY_COL;
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillText('[H] RIDE TO NEXT STATION', x, cy);
  } else if (subwayRide){
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px ui-monospace,monospace';
    ctx.fillText('▶ IN TRANSIT…', x, cy);
  } else {
    ctx.fillStyle = 'rgba(159,182,204,0.45)';
    ctx.font = '11px ui-monospace,monospace';
    ctx.fillText('FIND A STATION', x, cy);
  }
}

function drawMinimap(){
  const mw = 180, mh = 135;
  const mx = W - mw - 18, my = H - mh - 18;
  const sc = mw / WW;

  ctx.fillStyle = 'rgba(4,6,12,0.8)';
  ctx.fillRect(mx - 4, my - 4, mw + 8, mh + 8);
  ctx.strokeStyle = 'rgba(61,240,255,0.3)';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx - 4.5, my - 4.5, mw + 8, mh + 8);

  for (let i = 0; i < COLS; i++){
    const d = districtAt(i);
    ctx.fillStyle = DISTRICTS[d].ground;
    ctx.globalAlpha = 0.9;
    ctx.fillRect(mx + i*CELL*sc, my, CELL*sc + 0.5, mh);
    ctx.globalAlpha = 1;
  }

  // Subway line
  if (subway){
    ctx.strokeStyle = SUBWAY_COL;
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < subway.segments.length; i++){
      const seg = subway.segments[i];
      ctx.moveTo(mx + seg.a.x*sc, my + seg.a.y*sc);
      ctx.lineTo(mx + seg.b.x*sc, my + seg.b.y*sc);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    for (const s of subway.stops){
      ctx.fillStyle = SUBWAY_COL;
      ctx.fillRect(mx + s.x*sc - 2.5, my + s.y*sc - 2.5, 5, 5);
    }
  }

  ctx.strokeStyle = 'rgba(61,240,255,0.12)';
  ctx.beginPath();
  for (let i = 0; i <= COLS; i++){
    ctx.moveTo(mx + i*CELL*sc, my);
    ctx.lineTo(mx + i*CELL*sc, my + mh);
  }
  for (let j = 0; j <= ROWS; j++){
    ctx.moveTo(mx, my + j*CELL*sc);
    ctx.lineTo(mx + mw, my + j*CELL*sc);
  }
  ctx.stroke();

  for (const t of terminals){
    ctx.fillStyle = phase === 'UPLOAD' ? TERM_COL : 'rgba(43,255,136,0.5)';
    ctx.fillRect(mx + t.x*sc - 2, my + t.y*sc - 2, 4, 4);
  }

  for (const d of drops){
    if (!d.known && phase !== 'UPDATE') continue;
    let col;
    if (d.resolved) col = d.updated ? 'rgba(43,255,136,0.45)' : 'rgba(255,59,48,0.45)';
    else col = (d.id === primaryId && phase === 'LOCATE') ? PRIMARY_COL : DROP_COL;
    ctx.fillStyle = col;
    const s = (d.id === primaryId && phase === 'LOCATE' && !d.resolved) ? 4 : 3;
    ctx.fillRect(mx + d.x*sc - s/2, my + d.y*sc - s/2, s, s);
  }

  for (const r of rivals){
    if (r.state === 'patrol' && r.marked <= 0 && r.stunT <= 0) continue;
    ctx.fillStyle = r.stunT > 0 ? '#3df0ff' : r.state === 'alert' ? '#ff3b30' : 'rgba(255,157,43,0.7)';
    ctx.fillRect(mx + r.x*sc - 1.5, my + r.y*sc - 1.5, 3, 3);
  }

  ctx.fillStyle = PLAYER_COL;
  ctx.beginPath();
  ctx.arc(mx + player.x*sc, my + player.y*sc, 3.5, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = 'rgba(61,240,255,0.25)';
  ctx.strokeRect(mx + cam.x*sc, my + cam.y*sc, W*sc, H*sc);
}

/* ============================================================
   SCREENS
   ============================================================ */
function drawTitle(){
  ctx.fillStyle = '#04050a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(61,240,255,0.06)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x < W; x += 44){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += 44){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  const t = performance.now() / 1000;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff2d95';
  ctx.font = 'bold 13px ui-monospace,monospace';
  ctx.fillText('DDS // DEAD DROP SYSTEM', W/2, H/2 - 170);

  ctx.fillStyle = '#3df0ff';
  ctx.font = 'bold 62px ui-monospace,monospace';
  ctx.fillText('DEAD DROP', W/2, H/2 - 100);

  ctx.fillStyle = 'rgba(61,240,255,0.5)';
  ctx.font = '16px ui-monospace,monospace';
  ctx.fillText('C O U R I E R', W/2, H/2 - 68);

  ctx.fillStyle = '#9fb6cc';
  ctx.font = '13px ui-monospace,monospace';
  const lines = [
    'A near-future city. Encrypted caches rot in the walls.',
    '',
    'SCAN to find the freshest cache.  EXTRACT it.',
    'UPLOAD at a secure terminal.  Then UPDATE every remaining drop',
    'before the data decays — and before the patrols find you.',
    '',
    'Dead drops yield blueprints: weapons, transport, spiderphones, and Opium Lots.',
    'Spend Opium Lots on the zigzagging subway: 10 lots per stop, 4 stations east-west.',
    'Your loot, credits, and score persist across cycles — until you die.',
    '',
    'WASD move · SHIFT sprint · C crouch · E act · SPACE scan',
    '1/2/3 weapon · LMB fire · Q/F/G spiderphone · H subway'
  ];
  lines.forEach((l, i) => ctx.fillText(l, W/2, H/2 + 10 + i * 22));

  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
  ctx.fillStyle = '#ffd23f';
  ctx.font = 'bold 18px ui-monospace,monospace';
  ctx.fillText('PRESS [SPACE] TO JACK IN', W/2, H/2 + 280);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawEndScreen(win){
  ctx.fillStyle = 'rgba(4,5,10,0.86)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  const t = performance.now() / 1000;

  if (win){
    ctx.fillStyle = '#2bff88';
    ctx.font = 'bold 46px ui-monospace,monospace';
    ctx.fillText('RUN COMPLETE', W/2, H/2 - 140);

    ctx.fillStyle = '#9fb6cc';
    ctx.font = '14px ui-monospace,monospace';
    ctx.fillText('All dead drops secured. Progression preserved.', W/2, H/2 - 104);

    ctx.font = '16px ui-monospace,monospace';
    ctx.fillStyle = '#3df0ff';
    ctx.fillText('CACHES SECURED   ' + stat.updated, W/2, H/2 - 56);
    ctx.fillStyle = '#ff3b30';
    ctx.fillText('CACHES LOST      ' + stat.lost, W/2, H/2 - 28);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('MISSION SCORE    ' + stat.score, W/2, H/2 + 4);

    ctx.fillStyle = '#2bff88';
    ctx.font = 'bold 22px ui-monospace,monospace';
    ctx.fillText('TOTAL SCORE  ' + persistent.score, W/2, H/2 + 54);

    ctx.fillStyle = SUBWAY_COL;
    ctx.font = 'bold 16px ui-monospace,monospace';
    ctx.fillText('◈ OPIUM LOTS  ' + persistent.credits, W/2, H/2 + 82);

    let lx = W/2 - 260;
    ctx.textAlign = 'left';
    ctx.font = '12px ui-monospace,monospace';
    ctx.fillStyle = 'rgba(159,182,204,0.7)';
    ctx.fillText('LOOT BAG CARRIED FORWARD', lx, H/2 + 112);
    let ly = H/2 + 132;
    for (const k of WEAPON_ORDER){
      const lvl = persistent.loot.weapons[k];
      if (lvl > 0){
        ctx.fillStyle = WEAPON_DEFS[k].col;
        ctx.fillText('◆ ' + WEAPON_DEFS[k].name + '  L' + lvl, lx, ly);
        ly += 16;
      }
    }
    for (const k of ['runner', 'sprinter', 'ghost']){
      const lvl = persistent.loot.transport[k];
      if (lvl > 0){
        ctx.fillStyle = TRANSPORT_DEFS[k].col;
        ctx.fillText('◆ ' + TRANSPORT_DEFS[k].name + '  L' + lvl, lx, ly);
        ly += 16;
      }
    }
    for (const k of ['reset', 'spawn', 'remote']){
      const n = persistent.loot.comms[k];
      if (n > 0){
        ctx.fillStyle = COMM_DEFS[k].col;
        ctx.fillText('◆ ' + COMM_DEFS[k].name + '  ×' + n, lx, ly);
        ly += 16;
      }
    }
  } else {
    ctx.fillStyle = '#ff3b30';
    ctx.font = 'bold 46px ui-monospace,monospace';
    ctx.fillText('COURIER DOWN', W/2, H/2 - 120);

    ctx.fillStyle = '#9fb6cc';
    ctx.font = '14px ui-monospace,monospace';
    ctx.fillText('Signal lost. All accumulated data and loot wiped.', W/2, H/2 - 84);

    ctx.font = '16px ui-monospace,monospace';
    ctx.fillStyle = '#3df0ff';
    ctx.fillText('CACHES SECURED   ' + stat.updated, W/2, H/2 - 36);
    ctx.fillStyle = '#ff3b30';
    ctx.fillText('CACHES LOST      ' + stat.lost, W/2, H/2 - 8);
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('MISSION SCORE    ' + stat.score, W/2, H/2 + 20);

    ctx.fillStyle = '#ff3b30';
    ctx.font = 'bold 20px ui-monospace,monospace';
    ctx.fillText('TOTAL SCORE LOST  ' + persistent.score, W/2, H/2 + 66);
    ctx.fillStyle = SUBWAY_COL;
    ctx.font = 'bold 16px ui-monospace,monospace';
    ctx.fillText('OPIUM LOTS LOST   ' + persistent.credits, W/2, H/2 + 92);
    ctx.fillStyle = 'rgba(159,182,204,0.5)';
    ctx.font = '12px ui-monospace,monospace';
    ctx.fillText('Cycle counter reset to 1. Loot bag cleared.', W/2, H/2 + 118);
  }

  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px ui-monospace,monospace';
  ctx.fillText(win ? 'PRESS [R] FOR NEXT CYCLE' : 'PRESS [R] TO RESTART FROM SCRATCH', W/2, H/2 + 160);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

/* ============================================================
   BOOT
   ============================================================ */
genWorld();
buildSubway();
cycleNum = 0;
gameState = 'TITLE';
initPersistent();
player = { x: WW/2, y: WH/2, r: 11, hp: 100, maxHp: 100, angle: 0, crouch:false, sprint:false, hurtT:0, activeWeapon:null, weaponCd:{smg:0,taser:0,emp:0} };
cam = { x: player.x - W/2, y: player.y - H/2 };
drops = []; terminals = []; rivals = []; pulses = []; particles = []; effects = []; bullets = []; messages = [];
phase = 'LOCATE'; heat = 0; scanCd = 0; primaryId = null;
action = { active:false, type:null, target:null, progress:0, duration:0 };
stat = { updated: 0, lost: 0, score: 0 };
spawnTimer = 0; shakeT = 0; shakeMag = 0; endTimer = 0;

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (gameState === 'PLAY') update(dt);
  else {
    for (let i = messages.length - 1; i >= 0; i--){
      messages[i].t += dt;
      if (messages[i].t > messages[i].dur) messages.splice(i, 1);
    }
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
